name: Check

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_call: # the Release workflow runs these checks before publishing

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          java-version: 17
          distribution: temurin
      - uses: gradle/actions/setup-gradle@v5
      - name: Lint Kotlin
        run: ./gradlew ktfmtCheck
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          java-version: 17
          distribution: temurin
      - uses: gradle/actions/setup-gradle@v5
      - name: Start PostgreSQL and KurrentDB
        run: docker compose up -d --wait
      - name: Test with Gradle
        run: ./gradlew test
      - name: Publish Unit Test Results
        uses: EnricoMi/publish-unit-test-result-action@v2
        if: always()
        with:
          files: |
            */build/test-results/**/*.xml
